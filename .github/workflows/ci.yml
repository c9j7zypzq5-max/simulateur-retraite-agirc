name: CI

on:
  push:
    branches: [main]
  pull_request:

# Annule les exécutions précédentes encore en cours sur la même branche/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Build (Vite + HTML statiques)
        run: npm run build

  # builder/ (app.simfinly.com) est un projet autonome : ses dépendances, sa
  # config Vitest et son typecheck TypeScript ne sont pas couverts par le job
  # racine. Sans ce job, ses tests ne tournaient nulle part en CI.
  builder:
    name: Builder · Typecheck · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: builder
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: builder/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Build (tsc --noEmit + Vite)
        run: npm run build

  e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm run test:e2e

      - name: Publier le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
