<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simfinly Builder — créez et intégrez vos simulateurs</title>
    <meta name="description" content="Créez des calculateurs de devis et simulateurs financiers à vos couleurs, publiez-les et intégrez-les sur votre site. Barèmes français, capture de leads, sans code." />
    <meta name="theme-color" content="#2B5CE6" />
    <!-- Open Graph / Twitter (landing et routes SPA ; les pages publiques
         /s/:slug ont leurs propres balises via api/meta.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Simfinly Builder" />
    <meta property="og:title" content="Simfinly Builder — créez votre simulateur sans code" />
    <meta property="og:description" content="Calculateurs de devis et simulateurs financiers à vos couleurs, publiés en un clic. Barèmes français, capture de leads, sans code." />
    <meta property="og:url" content="https://app.simfinly.com/" />
    <meta property="og:image" content="https://app.simfinly.com/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://app.simfinly.com/og-cover.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Polices de la DA Simfinly : Space Grotesk (titres) + Hanken Grotesk (texte).
         Même chargement que le site principal (preconnect + stylesheet non bloquant). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" /></noscript>
    <script>
      // app.simfinly.com a pu servir le site principal (qui installe un service
      // worker) avant le déploiement du builder. Ce SW resté actif ressert un
      // cache obsolète → page blanche. Le builder n'utilise AUCUN service worker :
      // on désenregistre tout SW et on purge les caches au chargement (auto-heal).
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              rs.forEach(function (r) { r.unregister(); });
            }).catch(function () {});
          }
          if (window.caches && caches.keys) {
            caches.keys().then(function (ks) {
              ks.forEach(function (k) { caches.delete(k); });
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
