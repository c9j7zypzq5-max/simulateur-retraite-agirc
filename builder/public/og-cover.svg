<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B5CE6"/>
      <stop offset="100%" stop-color="#5B8CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="30%" r="55%">
      <stop offset="0%" stop-color="rgba(43,92,230,0.35)"/>
      <stop offset="100%" stop-color="rgba(43,92,230,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0B1020"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="6" fill="url(#blueGrad)"/>

  <!-- Marque -->
  <g transform="translate(80,74)">
    <rect width="52" height="52" rx="13" fill="url(#blueGrad)"/>
    <text x="26" y="37" font-family="'Space Grotesk', DM Sans, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
    <text x="70" y="34" font-family="'Space Grotesk', DM Sans, sans-serif" font-size="24" font-weight="700" fill="#E8EDF7">simfinly <tspan fill="#5B8CFF" font-style="italic">builder</tspan></text>
  </g>

  <!-- Badge -->
  <rect x="80" y="185" width="360" height="34" rx="17" fill="rgba(43,92,230,0.16)"/>
  <text x="104" y="207" font-family="DM Sans, sans-serif" font-size="14" fill="#8FB2FF" letter-spacing="1">✦ SANS CODE · À VOS COULEURS</text>

  <!-- Titre -->
  <text x="78" y="300" font-family="'Space Grotesk', DM Sans, sans-serif" font-size="58" font-weight="700" fill="#F4F7FD" letter-spacing="-1">Créez votre simulateur</text>
  <text x="78" y="368" font-family="'Space Grotesk', DM Sans, sans-serif" font-size="58" font-weight="700" fill="#5B8CFF" letter-spacing="-1">sans une ligne de code</text>

  <text x="80" y="424" font-family="DM Sans, sans-serif" font-size="23" fill="#9FB0C8">Calculateurs de devis &amp; simulateurs financiers, publiés en un clic.</text>

  <!-- Chips -->
  <rect x="80"  y="470" width="196" height="42" rx="10" fill="rgba(43,92,230,0.12)"/>
  <text x="178" y="497" font-family="DM Sans, sans-serif" font-size="16" fill="#8FB2FF" text-anchor="middle">✓ Barèmes FR 2026</text>
  <rect x="290" y="470" width="196" height="42" rx="10" fill="rgba(43,92,230,0.12)"/>
  <text x="388" y="497" font-family="DM Sans, sans-serif" font-size="16" fill="#8FB2FF" text-anchor="middle">✓ Capture de leads</text>

  <!-- Carte calculateur décorative -->
  <g transform="translate(760,150)">
    <rect width="360" height="330" rx="20" fill="#131C31" stroke="rgba(139,178,255,0.18)" stroke-width="1"/>
    <!-- champ 1 -->
    <text x="28" y="52" font-family="DM Sans, sans-serif" font-size="14" fill="#9FB0C8">Montant emprunté</text>
    <rect x="28" y="66" width="304" height="8" rx="4" fill="#22304C"/>
    <rect x="28" y="66" width="190" height="8" rx="4" fill="url(#blueGrad)"/>
    <circle cx="218" cy="70" r="9" fill="#5B8CFF"/>
    <!-- champ 2 -->
    <text x="28" y="112" font-family="DM Sans, sans-serif" font-size="14" fill="#9FB0C8">Durée</text>
    <rect x="28" y="126" width="304" height="8" rx="4" fill="#22304C"/>
    <rect x="28" y="126" width="120" height="8" rx="4" fill="url(#blueGrad)"/>
    <circle cx="148" cy="130" r="9" fill="#5B8CFF"/>
    <!-- résultat -->
    <rect x="28" y="166" width="304" height="86" rx="14" fill="rgba(43,92,230,0.14)"/>
    <text x="48" y="200" font-family="DM Sans, sans-serif" font-size="14" fill="#8FB2FF">Mensualité</text>
    <text x="48" y="236" font-family="'Space Grotesk', DM Sans, sans-serif" font-size="34" font-weight="700" fill="#F4F7FD">1 284 €</text>
    <!-- donut -->
    <circle cx="286" cy="212" r="26" fill="none" stroke="#22304C" stroke-width="10"/>
    <circle cx="286" cy="212" r="26" fill="none" stroke="url(#blueGrad)" stroke-width="10" stroke-dasharray="120 163" stroke-linecap="round" transform="rotate(-90 286 212)"/>
    <!-- bouton -->
    <rect x="28" y="272" width="304" height="40" rx="10" fill="url(#blueGrad)"/>
    <text x="180" y="298" font-family="DM Sans, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Calculer</text>
  </g>

  <text x="80" y="576" font-family="DM Sans, sans-serif" font-size="17" fill="#6B7A93">app.simfinly.com</text>
</svg>
